<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Are You OK?</title>
<style>
:root{font-family:"Comic Sans MS","Comic Sans",cursive;color:#26324d;background:#f3f6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 15%,#dceeff,transparent 45%),radial-gradient(circle at 90% 60%,#eee1ff,transparent 45%);min-height:100vh}button{font:inherit;cursor:pointer;border:0;min-height:48px;border-radius:18px;transition:transform .16s,box-shadow .16s}button:active{transform:scale(.96)}button:focus-visible{outline:4px solid #f5b83d;outline-offset:4px}button:disabled{cursor:default}main{max-width:1250px;margin:auto;padding:18px}header{display:grid;grid-template-columns:180px 1fr 180px;align-items:center;gap:16px}.score{padding:15px;border:2px solid #b9d5ff;border-radius:22px;background:#fff;box-shadow:0 5px 0 #dfe8f8;text-align:center}.score.purple{border-color:#d9befb}.score strong{display:block;font-size:29px}.stars{color:#b7bfce;letter-spacing:4px}.stars .on{color:#f0ae23}.title{text-align:center}h1{font-size:clamp(25px,4vw,43px);margin:6px}h2{font-size:clamp(23px,3vw,32px);margin:15px 0 8px}p{line-height:1.5}.roles{text-align:center;margin:15px 0;color:#566580;font-weight:bold}.toolbar{display:flex;justify-content:center;gap:12px;margin:24px}.small{background:#fff;color:#465572;padding:10px 18px;border:1px solid #cdd8ef}.page{text-align:center;animation:appear .3s}.characters{display:grid;grid-template-columns:repeat(2,minmax(0,280px));justify-content:center;gap:25px;margin:25px 0}.card{background:#fff;border:2px solid #dde3f3;border-radius:22px;overflow:hidden;padding:12px;box-shadow:0 5px 0 #e1e6f2;min-width:0}.card img{width:100%;object-fit:contain;display:block}.characters img{height:290px}.card .label{display:block;font-size:21px;font-weight:bold;padding:8px 0}.selection{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1050px;margin:20px auto}.selection img{height:205px}.guess-layout{display:grid;grid-template-columns:minmax(190px,28%) 1fr;gap:22px;align-items:center;margin-top:16px}.faces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.faces img{height:150px}.faces .card{box-shadow:none}.faces .correct{border-color:#3ab780;background:#e5fff1}.mystery{border:3px dashed #b6c5ea;border-radius:24px;min-height:335px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;overflow:hidden}.mystery img{width:100%;height:330px;object-fit:contain}.mystery .question{font-size:100px;color:#8b74d7;background:#f0ebff;border-radius:30px;position:relative;z-index:2;width:130px}.hidden-body{height:160px;width:100%;overflow:hidden;position:relative}.hidden-body img{position:absolute;height:330px;top:-170px;left:0}.pattern{font-size:clamp(25px,3vw,35px);font-weight:bold}.answers{font-size:20px;margin:5px;color:#596987}.hearts{display:flex;justify-content:center;gap:18px;margin:15px}.heart{font-size:55px;background:#fff2f5;color:#ef557b;border:2px solid #ffc9d6;width:85px;height:80px;line-height:1}.heart.lost{color:#b7bfce;background:#e6eaf1;border-color:#d4dae5;animation:pop .3s}.primary{background:#7660ce;color:white;font-weight:bold;font-size:21px;padding:15px 30px;box-shadow:0 5px 0 #5849a4}.yes{background:#2eac79;box-shadow:0 5px 0 #218157}.yes:disabled{opacity:.5}.feedback{min-height:57px;font-size:21px;font-weight:bold;margin:16px 0}.overlay{position:fixed;inset:0;background:#26324dbb;z-index:10;display:grid;place-items:center;padding:20px}.dialog{background:#fff;border-radius:30px;padding:36px;max-width:560px;width:100%;text-align:center;box-shadow:0 15px 60px #0003}.dialog h2{font-size:34px}.trophy{font-size:70px}.confetti{position:fixed;top:-20px;animation:fall 2.8s linear forwards;pointer-events:none;z-index:12;font-size:25px}.fallback{display:grid;place-items:center;min-height:140px;background:#eff2fa;border-radius:12px;color:#596987}footer{text-align:center;color:#6d7890;font-size:13px;padding:10px}.badge{display:inline-block;border-radius:20px;background:#e6eaff;padding:8px 16px}.hint{font-size:16px;color:#687691;margin:7px}.score.bump{animation:pop .35s}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pop{50%{transform:scale(1.18)}}@keyframes fall{to{transform:translateY(105vh) rotate(380deg)}}@media(max-width:850px){header{grid-template-columns:125px 1fr 125px}.faces{grid-template-columns:repeat(3,minmax(0,1fr))}.faces img{height:125px}.selection img{height:160px}}@media(max-width:580px){main{padding:10px}header{grid-template-columns:90px 1fr 90px;gap:7px}.score{padding:9px;font-size:13px}.score strong{font-size:24px}h1{font-size:24px}.stars{letter-spacing:1px}.characters{gap:12px}.characters img{height:210px}.selection{grid-template-columns:repeat(2,minmax(0,1fr))}.guess-layout{grid-template-columns:1fr}.mystery{min-height:210px}.mystery img{height:230px}.hidden-body{height:95px;width:180px}.hidden-body img{height:230px;top:-135px}.mystery .question{font-size:65px}.faces img{height:110px}.faces{gap:7px}.card{padding:7px}.card .label{font-size:17px}.heart{width:70px;height:67px;font-size:46px}.dialog{padding:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.pattern{font-size:clamp(34px,4.5vw,49px);margin:18px 0 8px}.answers{font-size:clamp(25px,3.3vw,35px);line-height:1.45}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.mystery .question{min-height:130px;box-shadow:0 5px 0 #d5c9f4;border:3px solid #d5c9f4}.mystery .question:hover{background:#e6ddff}.hidden-body{height:90px}.hidden-body img{top:-240px}@media(max-width:580px){.mystery .question{min-height:95px}.hidden-body{height:60px}.hidden-body img{top:-170px}.pattern{font-size:34px}}
</style></head><body><main><header><div class="score" id="score0"></div><div class="title"><h1>Are You OK?</h1></div><div class="score purple" id="score1"></div></header><div id="page"></div><div class="toolbar"><button id="sound" class="small"></button><button id="restart" class="small">Restart Game</button></div></main><div id="overlay"></div>
<script>
const images={"neutral": ["https://i.postimg.cc/44M9DjXM/Smiling-cartoon-boy-standing-straight.png", "https://i.postimg.cc/rFrrMgpN/Cheerful-Girl-in-Lavender-Dress.png"], "body": [["https://i.postimg.cc/NfsjP4Hr/Angry-cartoon-boy-standing-upright.png", "https://i.postimg.cc/44M9DjXM/Smiling-cartoon-boy-standing-straight.png", "https://i.postimg.cc/T2qP9Spg/Tearful-cartoon-boy-in-colorful-clothes.png", "https://i.postimg.cc/jqQjX9Lw/Sleepy-Cartoon-Boy-Yawning.png", "https://i.postimg.cc/5Ns2cCBm/Satisfied-boy-with-an-empty-dinner-plate.png", "https://i.postimg.cc/2jF5wJV1/Hungry-boy-with-a-hamburger-thought-bubble.png", "https://i.postimg.cc/XNcv8hp5/Thirsty-cartoon-boy-with-water-bubble.png"], ["https://i.postimg.cc/s27z2QWC/Angry-standing-cartoon-girl.png", "https://i.postimg.cc/rFrrMgpN/Cheerful-Girl-in-Lavender-Dress.png", "https://i.postimg.cc/9QvVVtrL/Sad-cartoon-girl-with-tears.png", "https://i.postimg.cc/6p7wD15d/Sleepy-cartoon-girl-in-lavender-dress.png", "https://i.postimg.cc/cLKZV54t/Full-and-satisfied-after-dinner.png", "https://i.postimg.cc/RZ39jbVn/Hungry-girl-with-a-hamburger-thought-bubble.png", "https://i.postimg.cc/XYZ3TD7C/Thirsty-girl-with-water-thought-bubble.png"]], "face": [["https://i.postimg.cc/SRKHcJnS/Angry-3D-cartoon-boy-head.png", "https://i.postimg.cc/J0hSjGsj/Happy-cartoon-boy-head-isolated.png", "https://i.postimg.cc/hvGNVfXG/Sad-cartoon-boy-with-tears.png", "https://i.postimg.cc/3Nwz2dkK/Sleepy-yawning-cartoon-boy.png", "https://i.postimg.cc/J0hSjGsR/Satisfied-boy-with-empty-plate-thought-bubble.png", "https://i.postimg.cc/VvN2XdJn/Hungry-boy-head-with-hamburger-bubble.png", "https://i.postimg.cc/mkrK7tPh/Thirsty-boy-and-water-thought-bubble.png"], ["https://i.postimg.cc/sx8HSKFt/Angry-cartoon-girl-with-pink-bow.png", "https://i.postimg.cc/8c3XWw82/Happy-Cartoon-Girl-Head-with-Pink-Bow.png", "https://i.postimg.cc/44FSr4KS/Tearful-girl-with-a-pink-bow.png", "https://i.postimg.cc/wMP4JFKn/Sleepy-girl-with-pink-bow.png", "https://i.postimg.cc/KcsHdcKs/Satisfied-girl-and-empty-plate-thought-bubble.png", "https://i.postimg.cc/7hct7X8r/Hungry-girl-with-hamburger-thought-bubble-(1).png", "https://i.postimg.cc/HWPhfWJN/Thirsty-girl-with-water-thought-bubble-(1).png"]]};
const words=['angry','happy','sad','tired','full','hungry','thirsty'];
const key='are-you-ok-game-v1';
const fresh=()=>({scores:[0,0],picker:0,page:1,character:null,secret:null,lost:[false,false,false],ended:false,won:false,sound:true});
let state=fresh(),busy=false,ctx;
try{const v=JSON.parse(localStorage.getItem(key));if(v&&Array.isArray(v.scores)&&v.scores.length===2&&v.scores.every(n=>Number.isInteger(n)&&n>=0&&n<=3)&&[0,1].includes(v.picker)&&[1,2,3].includes(v.page)){state={...fresh(),...v};if(![0,1].includes(state.character)&&state.page!==1)state=fresh();if(!Array.isArray(state.lost)||state.lost.length!==3)state.lost=[false,false,false];}}catch(e){}
// Always reopen at character selection, retaining match scores and turns.
state.page=1;state.character=null;state.secret=null;state.lost=[false,false,false];state.ended=false;state.won=state.scores.some(n=>n>=3);
const $=id=>document.getElementById(id),name=i=>'Student '+(i+1),guesser=()=>1-state.picker;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function sound(type){if(!state.sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const tones={pick:[440,554],wrong:[310,250],correct:[523,659,784],point:[659,880],win:[523,659,784,1047]}[type]||[440];tones.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.105;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.18)})}catch(e){}}
function imageFallback(img){const d=document.createElement('div');d.className='fallback';d.textContent=img.alt;img.replaceWith(d)}
function picture(url,label){return '<img src="'+url+'" alt="'+label+'" draggable="false" onerror="imageFallback(this)">'}
function card(url,label,attr='',cls=''){return '<'+(attr?'button':'div')+' class="card '+cls+'" '+attr+'>'+picture(url,label)+'<span class="label">'+label+'</span></'+(attr?'button':'div')+'>'}
function render(){
 for(let i=0;i<2;i++)$('score'+i).innerHTML=name(i)+'<strong>'+state.scores[i]+'</strong><div class="stars" aria-label="'+state.scores[i]+' of 3 points">'+[0,1,2].map(n=>'<span class="'+(state.scores[i]>n?'on':'')+'">★</span>').join('')+'</div>';
 document.querySelector('.title').style.visibility=state.page===1?'visible':'hidden';$('sound').textContent=state.sound?'Sound: On':'Sound: Off';$('sound').setAttribute('aria-pressed',String(state.sound));
 let content='';
 if(state.page===1)content='<h2>'+name(state.picker)+'</h2><div class="characters">'+images.neutral.map((u,i)=>card(u,i?'Girl':'Boy','data-character="'+i+'"')).join('')+'</div>';
 if(state.page===2)content='<h2>Choose 🤫</h2>'+(state.secret===null?'<div class="selection">'+words.map((w,i)=>card(images.body[state.character][i],w,'data-secret="'+i+'"')).join('')+'</div>':'');
 if(state.page===3){let remains=state.lost.filter(x=>!x).length;let reveal=state.ended;
 content='<div class="pattern">Are you _______?</div><div class="answers"><div>Yes, I am.</div><div>No, I’m not.</div></div><div class="hearts" aria-label="'+remains+' hearts remaining">'+state.lost.map((lost,i)=>'<button class="heart '+(lost?'lost':'')+'" data-heart="'+i+'" aria-label="'+(lost?'Used heart':'Remove heart '+(i+1)+' for a wrong guess')+'" '+(lost||reveal?'disabled':'')+'>♥</button>').join('')+'</div><div class="sr-only" role="status" aria-live="polite">'+(reveal?(remains?'Correct. '+name(guesser())+' gets one point.':'No points this round.'):(remains<3?'No, I’m not. '+remains+' hearts remaining.':''))+'</div><div class="guess-layout"><div class="mystery">'+(reveal?picture(images.body[state.character][state.secret],words[state.secret]):'<button class="question" id="correct-question" aria-label="Yes, I am. Correct guess. Reveal the feeling and award one point.">?</button><div class="hidden-body" aria-hidden="true">'+picture(images.neutral[state.character],'Mystery character')+'</div>')+'</div><div class="faces">'+words.map((w,i)=>card(images.face[state.character][i],w,'',reveal&&i===state.secret?'correct':'')).join('')+'</div></div>'+(reveal&&!state.won?'<p><button class="primary" id="next">Next Round →</button></p>':'');}
 $('page').innerHTML='<section class="page">'+content+'</section>';
 $('overlay').innerHTML=state.won?'<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Winner"><div class="trophy">🏆</div><h2>'+name(state.scores[0]>=3?0:1)+' wins!</h2><p>'+name(0)+': '+state.scores[0]+' &nbsp; · &nbsp; '+name(1)+': '+state.scores[1]+'</p><button class="primary" id="again">Play Again</button></div></div>':state.page===2&&state.secret!==null?'<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Secret is ready"><h2>'+name(guesser())+'</h2><button class="primary" id="start">Start</button></div></div>':'';
 bind();}
function bind(){document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{state.character=Number(b.dataset.character);state.page=2;state.secret=null;sound('pick');save();render()});document.querySelectorAll('[data-secret]').forEach(b=>b.onclick=()=>{if(state.secret!==null)return;state.secret=Number(b.dataset.secret);sound('pick');save();render()});document.querySelectorAll('[data-heart]').forEach(b=>b.onclick=()=>lose(Number(b.dataset.heart)));if($('start'))$('start').onclick=()=>{state.page=3;save();render()};if($('correct-question'))$('correct-question').onclick=correct;if($('next'))$('next').onclick=()=>{state.picker=guesser();state.page=1;state.character=null;state.secret=null;state.lost=[false,false,false];state.ended=false;busy=false;save();render()};if($('again'))$('again').onclick=reset;}
function lose(i){if(busy||state.ended||state.page!==3||state.lost[i])return;busy=true;state.lost[i]=true;sound('wrong');if(state.lost.every(Boolean))state.ended=true;save();render();setTimeout(()=>busy=false,650)}
function correct(){if(busy||state.ended||state.page!==3)return;busy=true;state.ended=true;state.scores[guesser()]++;state.won=state.scores[guesser()]>=3;save();render();sound(state.won?'win':'correct');$('score'+guesser()).classList.add('bump');if(state.won)confetti();setTimeout(()=>busy=false,650)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<24;i++){let c=document.createElement('span');c.className='confetti';c.textContent='★';c.style.left=Math.random()*100+'vw';c.style.color=['#f2bb48','#9d7cde','#61bddd','#ee82a6'][i%4];c.style.animationDelay=Math.random()*.5+'s';document.body.append(c);setTimeout(()=>c.remove(),3500)}}
function reset(){const pref=state.sound;state=fresh();state.sound=pref;busy=false;save();render()}
$('restart').onclick=()=>{if(confirm('Start a new game?'))reset()};$('sound').onclick=()=>{state.sound=!state.sound;if(state.sound)sound('pick');save();render()};render();
</script></body></html>
